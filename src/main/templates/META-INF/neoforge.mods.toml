modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Cordestian"
description='''
Fixes MineColonies food-history bookkeeping so citizens correctly track their most recently eaten food, preventing repeated meal streaks and unnecessary Dining Hall food-variety complaints.

No configuration is required.
'''

[[mixins]]
config="${mod_id}.mixins.json"
requiredMods=["minecolonies"]

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecolonies"
type="required"
versionRange="[1.1.1374,1.1.1375)"
ordering="AFTER"
side="BOTH"
